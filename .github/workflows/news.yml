name: News Bot

on:
  workflow_dispatch:   # 手動觸發
  schedule:
    - cron: "15,35,55 * * * *"  # 每小時 15, 35, 55 分執行

permissions:
  contents: write   # 讓 GITHUB_TOKEN 有寫入 repo 的權限

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install feedparser PyYAML requests python-dotenv
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SOURCES_YML: ${{ secrets.SOURCES_YML }}
        run: |
          # 1. 安全地建立 sources.yml，避免 Shell 誤解析內容
          echo "$SOURCES_YML" > sources.yml
          
          # 2. 檢查檔案是否成功產生且不為空
          if [ ! -s sources.yml ]; then
            echo "❌ Error: SOURCES_YML secret is empty or not created!"
            exit 1
          fi
          
          # 3. 執行程式 (請確認你的檔名是 run_bot.py)
          python run_bot.py

      - name: Commit pushed.json back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f pushed.json ]; then
            git add pushed.json
            if ! git diff --cached --quiet; then
              git commit -m "Update pushed.json [skip ci]"
              # 先拉取最新狀態再推，避免衝突
              git pull --rebase origin main
              git push origin HEAD:main
            else
              echo "No changes in pushed.json"
            fi
          fi
